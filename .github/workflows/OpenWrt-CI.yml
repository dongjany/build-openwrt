name: OpenWrt-CI

on:
  workflow_dispatch:
    inputs:
      # 源码仓库
      source_repo:
        description: "OpenWrt Source Repository (username/repo)"
        required: false
        default: "dongjany/openwrt"
      # 源码分支
      source_branch:
        description: "Git Branch To Pull"
        required: false
        default: "main"
      # 根分区大小 CONFIG_TARGET_ROOTFS_PARTSIZE
      target_rootfs_partsize:
        description: "RootFS 分区大小 (MB)"
        required: false
        default: "160"
      # LAN IP
      openwrt_ip:
        description: "Set OpenWrt default ip address."
        required: false
        default: "192.168.5.55"
      # 主题
      openwrt_theme:
        description: "Set OpenWrt default theme."
        required: false
        default: "luci-theme-argon"
      # 主机名
      openwrt_hostname:
        description: "Set OpenWrt default hostname."
        required: false
        default: "iStoreOS"
      # 额外软件包（支持空格/换行混合）
      extra_packages:
        description: "额外编译软件包，支持空格分隔、换行分隔，空行自动忽略"
        required: false
        type: textarea
        default: ""
      # 自定义DIY脚本
      custom_diy_script:
        description: "自定义修改源码Shell脚本，留空则不执行"
        required: false
        type: textarea
        default: ""
      # SSH调试
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
          - true
          - false

permissions:
  contents: write

jobs:
  build_openwrt:
    name: Build OpenWrt Firmware
    runs-on: ubuntu-24.04
    env:
      SOURCE_REPO: ${{ github.event.inputs.source_repo || 'dongjany/openwrt' }}
      SOURCE_BRANCH: ${{ github.event.inputs.source_branch || 'main' }}
      ROOTFS_SIZE: ${{ github.event.inputs.target_rootfs_partsize || '160' }}
      OPENWRT_IP: ${{ github.event.inputs.openwrt_ip || '192.168.5.55' }}
      OPENWRT_THEME: ${{ github.event.inputs.openwrt_theme || 'luci-theme-argon' }}
      OPENWRT_HOSTNAME: ${{ github.event.inputs.openwrt_hostname || 'iStoreOS' }}
      EXTRA_PKGS: ${{ github.event.inputs.extra_packages }}
      DIY_SCRIPT: ${{ github.event.inputs.custom_diy_script }}
      BUILD_TAG: ""

    steps:
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout Custom OpenWrt Source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1

      - name: Free disk space
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Update & Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Basic config replace (IP/Hostname/Theme)
        run: |
          echo "📦 源码仓库：${SOURCE_REPO}"
          echo "🌿 源码分支：${SOURCE_BRANCH}"
          echo "💾 RootFS分区大小：${ROOTFS_SIZE}MB"
          echo "🌐 LAN地址：${OPENWRT_IP}"
          echo "🎨 默认主题：${OPENWRT_THEME}"
          echo "🖥️ 主机名称：${OPENWRT_HOSTNAME}"
          # 修改网关IP
          sed -i "s/192.168.1.1/${OPENWRT_IP}/g" package/base-files/files/bin/config_generate
          # 主题替换容错
          if [ -f ./feeds/luci/collections/luci-light/Makefile ]; then
            sed -i "s/luci-theme-bootstrap/${OPENWRT_THEME}/g" ./feeds/luci/collections/luci-light/Makefile
          fi
          # 修改主机名
          sed -i "s/OpenWrt/${OPENWRT_HOSTNAME}/g" package/base-files/files/bin/config_generate

      - name: Run Custom DIY Script
        if: env.DIY_SCRIPT != ''
        run: |
          echo -e "\033[32m==================== 开始执行自定义DIY脚本 ====================\033[0m"
          echo "${DIY_SCRIPT}" > diy_custom.sh
          chmod +x diy_custom.sh
          ./diy_custom.sh
          echo -e "\033[32m==================== 自定义DIY脚本执行完成 ====================\033[0m"

      - name: Set RootFS Partition Size & Extra Packages
        run: |
          echo -e "\033[34m===== 配置分区大小与额外软件包 =====\033[0m"
          # 覆盖根分区大小
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_SIZE}" >> .config
          echo "已设置分区大小: CONFIG_TARGET_ROOTFS_PARTSIZE=${ROOTFS_SIZE}"

          # 处理额外软件包：支持空格/换行混合分隔，自动清理空白
          if [[ -n "${EXTRA_PKGS}" ]]; then
            PKGS=$(echo "${EXTRA_PKGS}" | tr '\n' ' ' | xargs)
            for pkg in ${PKGS}; do
              echo "CONFIG_PACKAGE_${pkg}=y" >> .config
              echo "启用软件包: ${pkg}"
            done
          else
            echo "未填写额外软件包"
          fi

      - name: SSH connect to Actions
        uses: P3TERX/ssh2actions@main
        if: github.event.inputs.ssh == 'true'

      - name: Generate build tag name
        run: |
          TAG=$(date +"%Y-%m-%d_%H-%M-%S")
          echo "BUILD_TAG=${TAG}" >> $GITHUB_ENV

      - name: Download all packages
        run: |
          make defconfig
          make download -j8

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Organize firmware & ipk files
        run: |
          find bin/packages -name "*.ipk" -exec mv {} bin/targets/*/*/packages/ \; 2>/dev/null
          cp -f .config bin/targets/*/*/
          cd bin/targets/*/*
          [ -d packages ] && find packages -maxdepth 1 -type f ! -name "*.ipk" -delete
          [ -d packages ] && zip -r packages.zip packages
          rm -rf packages config.buildinfo feeds.buildinfo version.buildinfo sha256sums *.json *.asc *.manifest *.sig
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: ${{ env.BUILD_TAG }} ❤️ OpenWrt 自动编译固件
          body: |
            📂 源码仓库：https://github.com/${{ env.SOURCE_REPO }}
            🌿 编译分支：${{ env.SOURCE_BRANCH }}
            💾 根分区大小：${{ env.ROOTFS_SIZE }} MB
            📦 额外软件包：${{ if env.EXTRA_PKGS != '' }}已配置${{ else }}无${{ endif }}
            🛠️ 自定义DIY脚本：${{ if env.DIY_SCRIPT != '' }}已启用${{ else }}未填写${{ endif }}

            📌 主机名： ${{ env.OPENWRT_HOSTNAME }}
            🎨 默认主题： ${{ env.OPENWRT_THEME }}
            🌐 LAN网关IP： ${{ env.OPENWRT_IP }}

            👤 登录用户名： root
            🔒 默认密码： password
          files: ${{ env.FIRMWARE }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
